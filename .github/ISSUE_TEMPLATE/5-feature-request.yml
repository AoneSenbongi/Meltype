name: 機能提案
description: 新しい機能の提案・リクエスト
title: "[機能提案] "
labels: ["機能提案"]
body:
  - type: markdown
    attributes:
      value: |
        機能提案ありがとうございます。今は不具合の修正と判定・変換の精度を優先しているため、すぐには入れられないことがあります。
        機能の利用シーン・利点などを詳しく説明いただけると、検討しやすくなります。

  - type: textarea
    id: use-case
    attributes:
      label: 利用シーン
      description: どんなとき・どんな場面で、この機能が必要か
      placeholder: |
        例：プログラミング時に、コメント内の日本語と英字コードを混ぜて書くとき、
        英字部分の判定がうまくいかないので、判定モードを切り替えたい
    validations:
      required: true

  - type: textarea
    id: problem
    attributes:
      label: 困っていること・解決したい問題
      description: 現在の状況で何が不便か、どう改善されたいか
      placeholder: |
        例：現在は英字モードと日本語モードの切り替えが手動なので、
        使い分けが面倒。自動で判定できるようになるといい
    validations:
      required: true

  - type: textarea
    id: feature
    attributes:
      label: 提案する機能
      description: 具体的な機能・実装のアイデア
      placeholder: |
        例：エディターの言語設定やファイルの拡張子から、
        自動で判定モードを切り替える機能
    validations:
      required: true

  - type: textarea
    id: benefit
    attributes:
      label: 期待できる効果・メリット
      description: この機能があると、どんなメリットがあるか
      placeholder: |
        例：- 判定モードの手動切り替えが減り、操作が楽になる
        - プログラミング時の効率が上がる
        - 複数の言語を混ぜるユーザーの利便性が向上する

  - type: textarea
    id: examples
    attributes:
      label: 具体例
      description: "入力例と期待される動作 (あれば)"
      placeholder: |
        例：
        - Python ファイルで編集中：nihongo → 日本語に (英字モード無効)
        - JavaScript ファイルで編集中：nihongo → にほんご (日本語モード有効)

  - type: dropdown
    id: os
    attributes:
      label: 対象 OS
      multiple: true
      options:
        - Windows
        - Mac
        - Linux
        - すべて

  - type: checkboxes
    id: checklist
    attributes:
      label: 確認事項
      options:
        - label: 似た機能提案が無いか確認しました
        - label: 本当に必要か・利用シーンが現実的か、考えました
        - label: AI を使った場合は、内容を理解し自分で確認しました
