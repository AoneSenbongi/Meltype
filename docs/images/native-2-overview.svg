<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="360" viewBox="0 0 1080 360" role="img" aria-labelledby="title desc">
<title id="title">Meltype Native：入力から表示まで</title><desc id="desc">ローマ字を日英判別し、GoogleまたはMicrosoftで変換し、元の入力欄へ表示します。説明用の概念図です。</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10" fill="#52718c"/></marker></defs>
<rect width="1080" height="360" rx="20" fill="#eef5fc"/>
<g font-family="Yu Gothic,Meiryo,sans-serif" fill="#172c43">
<text x="35" y="49" font-size="25" font-weight="700">日本語と英語を、いつもの入力欄で。</text><text x="35" y="79" font-size="15" fill="#42627e">Meltype Native 2.0.0 · 本家1.3.0の共通処理 ＋ 独自のWindows IME</text>
<g fill="#fff" stroke="#bfd2e4"><rect x="35" y="111" width="292" height="170" rx="14"/><rect x="394" y="111" width="292" height="170" rx="14"/><rect x="753" y="111" width="292" height="170" rx="14"/></g>
<path d="M340 197H380" stroke="#52718c" stroke-width="3" marker-end="url(#arrow)"/><path d="M699 197H739" stroke="#52718c" stroke-width="3" marker-end="url(#arrow)"/>
<text x="55" y="147" font-size="19" font-weight="700">01　そのまま打つ</text><text x="55" y="188" font-size="17">kyouha google de kensaku</text><text x="55" y="226" font-size="16">日本語の読みと英語を判別</text><text x="55" y="251" font-size="14" fill="#52718c">※読みやすさのため空白で区切って表示</text>
<text x="414" y="147" font-size="19" font-weight="700">02　エンジンを選ぶ</text><text x="414" y="193" font-size="19" fill="#145c8c">Google日本語入力</text><text x="414" y="228" font-size="19">Microsoft IME</text><text x="414" y="255" font-size="14" fill="#52718c">管理画面で切り替え</text>
<text x="773" y="147" font-size="19" font-weight="700">03　元の入力欄へ</text><text x="773" y="194" font-size="21">今日はgoogleで検索</text><path d="M775 204H1019" stroke="#2486b1" stroke-width="2"/><text x="773" y="238" font-size="16">未確定表示 → 候補選択 → 確定</text><text x="773" y="261" font-size="14" fill="#52718c">フォントや色は入力先に従います</text>
<text x="35" y="325" font-size="15" fill="#42627e">概念図です。Google日本語入力は別途導入。zenzモデルは配布物に含みません。</text>
</g></svg>
